<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>이원희 · 양은정 결혼식에 초대합니다</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@200;300;400;500&family=Cormorant+Garamond:ital@0;1&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#242424;
    --mute:#8c8c8c;
    --line:#dcdcdc;
    --accent:#9a7b63;
    --paper:#fdfdfc;
    --bg:#f6f5f2;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{scroll-behavior:smooth;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Noto Serif KR', serif;
    font-weight:300;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }
  .frame{
    max-width:480px;
    margin:0 auto;
    background:var(--paper);
    min-height:100vh;
    position:relative;
  }

  .reveal{ opacity:0; transform:translateY(14px); transition:opacity 1s ease, transform 1s ease; }
  .reveal.in{ opacity:1; transform:translateY(0); }
  @media (prefers-reduced-motion: reduce){ .reveal{ opacity:1; transform:none; transition:none; } }

  /* ---------- uploader panel ---------- */
  .upload-panel{
    background:#2c2b29;
    color:#f2f0e9;
    padding:20px;
    font-size:13px;
    line-height:1.6;
    border-bottom:2px solid var(--accent);
  }
  .upload-panel h3{
    font-size:14px;
    font-weight:400;
    margin-bottom:12px;
    color:#fff;
    display:flex;
    align-items:center;
    gap:6px;
  }
  .upload-group{
    margin-bottom:12px;
  }
  .upload-group:last-child{ margin-bottom:0; }
  .upload-group label{
    display:block;
    font-size:11px;
    color:#c9c4b7;
    margin-bottom:4px;
    letter-spacing:0.05em;
  }
  .upload-group input[type="file"]{
    width:100%;
    font-size:12px;
    color:#e7e3da;
    background:#1e1d1b;
    border:1px solid #44413c;
    padding:6px 8px;
    border-radius:4px;
    cursor:pointer;
  }
  .upload-group input[type="file"]::file-selector-button{
    background:var(--accent);
    color:#fff;
    border:none;
    padding:4px 10px;
    border-radius:2px;
    cursor:pointer;
    font-family:'Noto Serif KR', serif;
    font-size:11px;
    margin-right:8px;
  }

  /* ---------- hero ---------- */
  .hero{
    position:relative;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    justify-content:flex-end;
    overflow:hidden;
  }
  .hero-slider{
    position:absolute; inset:0;
    width:100%; height:100%;
  }
  .hero-slide{
    position:absolute; inset:0;
    width:100%; height:100%;
    opacity:0;
    transition:opacity 0.8s ease-in-out;
    pointer-events:none;
  }
  .hero-slide.active{
    opacity:1;
    pointer-events:auto;
  }
  .hero-slide img{
    width:100%; height:100%;
    object-fit:cover;
    object-position:center 30%;
    filter:saturate(0.92) contrast(1.02);
  }
  .hero::after{
    content:"";
    position:absolute; inset:0;
    background:linear-gradient(180deg, rgba(20,20,20,0.02) 0%, rgba(20,20,20,0.06) 40%, rgba(15,14,12,0.72) 100%);
    pointer-events:none;
  }
  
  /* Hero Nav Buttons & Dots */
  .hero-nav-btn{
    position:absolute;
    top:50%;
    transform:translateY(-50%);
    z-index:10;
    background:rgba(0, 0, 0, 0.25);
    color:rgba(255, 255, 255, 0.85);
    border:none;
    width:40px;
    height:40px;
    border-radius:50%;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:18px;
    transition:background 0.3s, color 0.3s;
    backdrop-filter:blur(2px);
  }
  .hero-nav-btn:hover{
    background:rgba(0, 0, 0, 0.5);
    color:#fff;
  }
  .hero-nav-prev{ left:12px; }
  .hero-nav-next{ right:12px; }

  .hero-dots{
    position:absolute;
    top:20px;
    right:20px;
    z-index:10;
    display:flex;
    gap:6px;
  }
  .hero-dot{
    width:7px;
    height:7px;
    border-radius:50%;
    background:rgba(255,255,255,0.4);
    cursor:pointer;
    transition:background 0.3s, transform 0.3s;
  }
  .hero-dot.active{
    background:#fff;
    transform:scale(1.2);
  }

  .hero-content{
    position:relative; z-index:2;
    padding:0 12% 8vh;
    color:#fdfdfc;
    text-align:center;
    pointer-events:none;
  }
  .hero-eyebrow{
    font-family:'Cormorant Garamond', serif;
    font-style:italic;
    letter-spacing:0.4em;
    font-size:11px;
    color:#e7e3da;
    text-transform:uppercase;
    margin-bottom:26px;
  }
  .hero-names{
    font-size:27px;
    font-weight:300;
    line-height:1.9;
    letter-spacing:0.06em;
  }
  .hero-and{
    display:block;
    width:14px;
    height:1px;
    background:rgba(255,255,255,0.5);
    margin:16px auto;
  }
  .hero-date{
    margin-top:30px;
    font-size:12.5px;
    letter-spacing:0.2em;
    color:#f2f0e9;
  }
  .hero-venue{
    margin-top:7px;
    font-size:11.5px;
    letter-spacing:0.1em;
    color:#c9c4b7;
  }

  hr.rule{
    border:none;
    height:1px;
    background:var(--line);
    margin:0 12%;
  }

  /* ---------- sections ---------- */
  section{ padding:70px 12% 8px; }
  .label{
    font-family:'Cormorant Garamond', serif;
    font-style:italic;
    font-size:11px;
    letter-spacing:0.3em;
    color:var(--accent);
    text-transform:uppercase;
    margin-bottom:26px;
    display:block;
  }

  /* greeting */
  .greeting p{
    font-size:14.5px;
    line-height:2.15;
    color:#4a4a4a;
    letter-spacing:0.02em;
  }
  .greeting .signoff{
    margin-top:40px;
    font-size:13px;
    line-height:2.1;
    color:var(--ink);
  }
  .greeting .signoff b{ font-weight:400; }

  /* full-bleed photo break */
  .photo-break{ padding:0; }
  .photo-break figure{ margin:0; }
  .photo-break img{ width:100%; display:block; }
  .photo-break figcaption{
    padding:16px 12% 0;
    font-family:'Cormorant Garamond', serif;
    font-style:italic;
    font-size:12px;
    letter-spacing:0.08em;
    color:var(--mute);
    text-align:center;
  }

  /* date/time */
  .when-day{
    font-size:32px;
    font-weight:300;
    letter-spacing:0.05em;
    color:var(--ink);
    margin-bottom:6px;
  }
  .when-sub{
    font-size:12px;
    color:var(--mute);
    letter-spacing:0.15em;
    margin-bottom:28px;
  }
  .dday{
    font-size:12px;
    letter-spacing:0.1em;
    color:var(--accent);
  }

  /* location */
  .venue-name{
    font-size:18px;
    font-weight:400;
    color:var(--ink);
    margin-bottom:6px;
  }
  .venue-hall{
    font-size:13px;
    color:var(--accent);
    margin-bottom:20px;
    letter-spacing:0.05em;
  }
  .venue-addr{
    font-size:13px;
    color:var(--mute);
    line-height:1.9;
    margin-bottom:26px;
  }
  .map-links{
    display:flex;
    gap:0;
    margin-bottom:30px;
    border-top:1px solid var(--line);
    border-bottom:1px solid var(--line);
  }
  .map-links a{
    flex:1;
    text-align:center;
    padding:14px 0;
    font-size:12px;
    letter-spacing:0.1em;
    color:var(--ink);
    text-decoration:none;
    border-left:1px solid var(--line);
  }
  .map-links a:first-child{ border-left:none; }
  .transit{
    font-size:12.5px;
    line-height:2.1;
    color:var(--mute);
  }
  .transit b{ color:var(--ink); font-weight:400; }

  /* gallery grid */
  .gallery-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:2px;
  }
  .gallery-grid img{ width:100%; height:100%; object-fit:cover; display:block; }
  .gallery-grid div.gallery-item{ display:block; aspect-ratio:1/1; overflow:hidden; }

  /* accounts */
  .acc-toggle{
    width:100%;
    padding:16px 0;
    background:none;
    border:none;
    border-top:1px solid var(--line);
    border-bottom:1px solid var(--line);
    font-family:'Noto Serif KR', serif;
    font-size:13px;
    letter-spacing:0.1em;
    color:var(--ink);
    cursor:pointer;
    text-align:left;
  }
  .acc-body{
    max-height:0;
    overflow:hidden;
    transition:max-height 0.4s ease;
  }
  .acc-body.open{ max-height:600px; margin-top:22px; }
  .acc-group{ margin-bottom:20px; }
  .acc-side{
    font-size:11px;
    letter-spacing:0.15em;
    color:var(--accent);
    margin-bottom:10px;
  }
  .acc-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-size:13px;
    padding:10px 0;
    border-bottom:1px solid var(--line);
    color:#4a4a4a;
  }
  .acc-row button{
    font-family:'Noto Serif KR', serif;
    font-size:11px;
    padding:4px 0;
    background:none;
    border:none;
    color:var(--mute);
    cursor:pointer;
    text-decoration:underline;
    text-underline-offset:3px;
  }

  /* closing */
  .closing{
    text-align:center;
    padding:0 0 50px;
  }
  .closing-text{
    padding:52px 14% 0;
  }
  .closing p{
    font-size:13px;
    line-height:2.2;
    color:var(--mute);
    letter-spacing:0.03em;
  }
  footer{
    text-align:center;
    font-size:10.5px;
    letter-spacing:0.15em;
    color:#bbb;
    padding-bottom:36px;
  }

  .note{
    font-size:10.5px;
    color:#bfae9d;
    letter-spacing:0.04em;
    margin-top:14px;
  }
</style>
</head>
<body>
<div class="frame">

  <!-- 이미지 업로드 제어 패널 -->
  <div class="upload-panel">
    <h3>📷 사진 직접 교체하기</h3>
    <div class="upload-group">
      <label>1. 메인 슬라이드 사진들 (여러 장 선택 시 슬라이드 이동 가능)</label>
      <input type="file" id="heroInput" accept="image/*" multiple>
    </div>
    <div class="upload-group">
      <label>2. 중간 구분 사진 (Photo Break)</label>
      <input type="file" id="breakInput" accept="image/*">
    </div>
    <div class="upload-group">
      <label>3. 갤러리 사진들 (여러 장 선택 가능)</label>
      <input type="file" id="galleryInput" accept="image/*" multiple>
    </div>
  </div>
